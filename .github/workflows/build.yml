name: Build SPFx Dashboard Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [18.17.1]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Clean previous build
      run: npx gulp clean
      continue-on-error: true

    - name: Build
      run: npm run build

    - name: Run gulp bundle directly
      run: npx gulp bundle

    - name: Check build output
      run: |
        Write-Host "=== Checking Build Directories ==="
        Write-Host "Current working directory: $(Get-Location)"
        Write-Host ""
        Write-Host "=== Top-level directory contents ==="
        Get-ChildItem -Path . -Force | Format-Table Name, Mode
        Write-Host ""
        Write-Host "=== Checking lib/ directory ==="
        if (Test-Path lib) {
          Write-Host "✓ lib/ directory exists"
          Write-Host "File count: $(Get-ChildItem lib -Recurse | Measure-Object | Select-Object -ExpandProperty Count)"
        } else {
          Write-Host "✗ lib/ directory does NOT exist"
        }
        Write-Host ""
        Write-Host "=== Checking dist/ directory ==="
        if (Test-Path dist) {
          Write-Host "✓ dist/ directory exists"
          Get-ChildItem dist -Recurse | Format-Table FullName
        } else {
          Write-Host "✗ dist/ directory does NOT exist"
        }
        Write-Host ""
        Write-Host "=== Checking temp/ directory ==="
        if (Test-Path temp) {
          Write-Host "✓ temp/ directory exists"
          Get-ChildItem temp -Recurse | Format-Table FullName
        } else {
          Write-Host "✗ temp/ directory does NOT exist"
        }

    - name: Run gulp package-solution directly
      run: npx gulp package-solution --verbose

    - name: Check solution output
      run: |
        Write-Host "=== Checking solution/ directory ==="
        if (Test-Path solution) {
          Write-Host "✓ solution/ directory EXISTS"
          Write-Host ""
          Write-Host "Contents:"
          Get-ChildItem solution -Recurse -Force | Format-Table FullName, Length
          Write-Host ""
          Write-Host "Looking for .sppkg files:"
          Get-ChildItem solution -Recurse -Filter "*.sppkg" | Format-Table FullName
        } else {
          Write-Host "✗ solution/ directory DOES NOT EXIST"
          Write-Host ""
          Write-Host "Searching entire workspace for .sppkg files:"
          Get-ChildItem -Recurse -Filter "*.sppkg" -ErrorAction SilentlyContinue | Format-Table FullName
        }

    - name: Package solution
      run: npx gulp package-solution

    - name: Upload .sppkg artifact
      uses: actions/upload-artifact@v4
      with:
        name: DPW-Dashboard.sppkg
        path: solution/DPW-Dashboard.sppkg
        retention-days: 30

    - name: Display build output
      run: |
        Write-Host "=== Build Complete ==="
        Write-Host "Package created at: solution/DPW-Dashboard.sppkg"
        if (Test-Path solution/*.sppkg) {
          Get-Item solution/*.sppkg | Format-Table Name, Length
        } else {
          Write-Host "Warning: .sppkg file not found at solution/"
        }

    - name: Validate artifact was created
      run: |
        if (Test-Path solution/DPW-Dashboard.sppkg) {
          Write-Host "✓ SUCCESS: .sppkg artifact created"
          Exit 0
        } else {
          Write-Host "✗ FAILED: .sppkg artifact was not created"
          Write-Host "Build output:"
          if (Test-Path solution) {
            Get-ChildItem solution -Recurse | Format-Table FullName
          } else {
            Write-Host "solution/ directory does not exist"
          }
          if (Test-Path lib) {
            Write-Host "lib/ directory exists"
            Get-ChildItem lib -Recurse | Measure-Object | Select-Object Count
          } else {
            Write-Host "lib/ directory does not exist"
          }
          Exit 1
        }
