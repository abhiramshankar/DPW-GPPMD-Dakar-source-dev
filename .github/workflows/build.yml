name: Build SPFx Dashboard Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [18.17.1]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run build

    - name: Check build output
      run: |
        Write-Host "Checking for lib/ directory..."
        if (Test-Path lib) {
          Write-Host "lib/ directory exists"
          Get-ChildItem lib -Recurse | Select-Object -First 20 | Format-Table Name, FullName
        } else {
          Write-Host "ERROR: lib/ directory not found - build may have failed"
        }

    - name: Package solution
      run: npx gulp package-solution

    - name: Upload .sppkg artifact
      uses: actions/upload-artifact@v4
      with:
        name: DPW-Dashboard.sppkg
        path: solution/DPW-Dashboard.sppkg
        retention-days: 30

    - name: Display build output
      run: |
        Write-Host "=== Build Complete ==="
        Write-Host "Package created at: solution/DPW-Dashboard.sppkg"
        if (Test-Path solution/*.sppkg) {
          Get-Item solution/*.sppkg | Format-Table Name, Length
        } else {
          Write-Host "Warning: .sppkg file not found at solution/"
        }
